name: Build Elarion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Ekstrak proyek dari elarion.zip
        run: |
          rm -rf proj && mkdir proj
          unzip -q elarion.zip -d proj

      - name: Build APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Siapkan APK
        run: cp proj/app/build/outputs/apk/release/app-release.apk Elarion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Elarion-apk
          path: Elarion.apk

      - name: Publikasikan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Elarion build ${{ github.run_number }}
          files: Elarion.apk
